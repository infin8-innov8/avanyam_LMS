[project]
name = "avanyam"
version = "0.1.0"
description = "Avanyam — internal learning & capability building platform"
requires-python = "==3.11.*"
readme = "prd.md"

# ---------------------------------------------------------------------------
# BASE — installed on every host that runs Python.
# Database driver and configuration loading. No Django.
# ---------------------------------------------------------------------------
dependencies = [
    "psycopg[binary]>=3.2,<4",     # PostgreSQL driver (psycopg 3)
    "django-environ>=0.12",        # env-var configuration
    "python-dotenv>=1.0",          # .env loading
]

# ---------------------------------------------------------------------------
# APP — the Django application stack.
# Installed on VM1 (terra: gunicorn + celery-fast) and VM3 (aqua: celery-bulk).
# NOT installed on VM2 (aero): nothing on the data tier imports Django.
# ---------------------------------------------------------------------------
[project.optional-dependencies]
app = [
    "Django==5.2.*",                        # 5.2 LTS, extended support to Apr 2028
    # API
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-filter>=24.3",
    # Security
    "django-axes>=7.0",                     # progressive lockout, per user AND per IP
    "django-csp>=4.0",                      # strict nonce-based CSP
    "argon2-cffi>=23.1",                    # Argon2id password hashing
    "django-simple-history>=3.7",           # field-level history on sensitive models
    # Identity
    "Authlib>=1.3",                         # OIDC client (PKCE, JWKS, nonce)
    "PyJWT>=2.9",
    # Async
    "celery[redis]>=5.4",
    "redis>=5.2",
    "django-celery-beat>=2.7",              # DB-backed schedules, no redeploy
    # Object storage
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    # Media
    "Pillow>=11.0",
    "av>=13.0",                             # PyAV — media metadata
    "pyclamd>=0.4",                         # ClamAV client
    # Serving
    "gunicorn>=23.0",
    "whitenoise>=6.8",                      # static fallback, correct without Nginx
    # Observability
    "structlog>=24.4",
    "django-prometheus>=2.3",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-django>=0.49b0",
    "opentelemetry-instrumentation-celery>=0.49b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28",
    "sentry-sdk>=2.15",
    # Health
    "django-health-check>=3.18",            # /livez and /readyz
]

# ---------------------------------------------------------------------------
# DB — data-tier operator tooling.
# Installed on VM2 (aero). No Django: Postgres, PgBouncer, Keycloak and WAL-G
# do not import the application.
# ---------------------------------------------------------------------------
db = [
    "psycopg[binary]>=3.2",
    "pgcli>=4.3",                           # operator SQL client
]

# ---------------------------------------------------------------------------
# LDAP — OPTIONAL. Install only once the LDAP fallback is confirmed to be
# needed (open question Q5 in memory.md).
#
# Deliberately NOT part of `app`: django-auth-ldap pulls python-ldap, which
# compiles C and needs libldap2-dev + a compiler. Forcing that on every host
# to support a fallback path that may stay disabled is the wrong trade. Entra
# ID via OIDC is the primary path and needs no system libraries.
# ---------------------------------------------------------------------------
ldap = [
    "django-auth-ldap>=5.1",
]

# ---------------------------------------------------------------------------
# DEV — lint, types, tests, security tooling that does NOT import Django.
# Safe on every host, including the data tier.
# ---------------------------------------------------------------------------
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",                    # parallel test matrix
    "freezegun>=1.5",                       # deadline / expiry logic
    "ruff>=0.8",                            # lint + format
    "mypy>=1.13",
    "types-requests>=2.32",
    "bandit>=1.8",                          # Python security lint
    "pip-audit>=2.7",                       # dependency CVE scanning
    "pre-commit>=4.0",
]

# ---------------------------------------------------------------------------
# DEV-APP — developer tooling that requires Django to be importable.
# Installed on VM1 (terra) and VM3 (aqua) only.
#
# Split from `dev` on purpose: pytest-django and django-stubs both declare a
# hard dependency on Django, so a single combined group would silently pull
# Django onto the data tier and break the "no application code on VM2" rule.
# ---------------------------------------------------------------------------
dev-app = [
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "django-stubs>=5.1",
    "djangorestframework-stubs>=3.15",
    "django-upgrade>=1.22",
]

# ---------------------------------------------------------------------------
# No local-db group: development runs a real PostgreSQL and Redis, installed
# user-locally without root (see DEPLOYMENT.md). Mocking the database defeats
# the purpose of testing transactional correctness.
#
# psycopg binary wheels are used deliberately — they avoid the libpq and
# libldap system build dependencies, which cannot be installed without root.
# ---------------------------------------------------------------------------

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# This project is a dependency MANIFEST, not an installable distribution.
# The three avanyam_* directories are per-VM deployment roots, not Python
# packages, and setuptools' flat-layout auto-discovery otherwise refuses to
# build ("Multiple top-level packages discovered"). Install with
# `uv pip install --no-install-project '.[app,dev]'` so only dependencies are
# resolved. P0.2 moves the code to a src/ layout, after which this becomes a
# real package and the flag can be dropped.
# ---------------------------------------------------------------------------
[tool.setuptools]
py-modules = []

# ---------------------------------------------------------------------------
# Tests
#
# `--reuse-db` is required, not an optimisation. No role on this host has
# CREATEDB, so Django cannot create a `test_avanyam` database; config/settings/
# test.py points TEST["NAME"] at the existing database instead. See the warning
# block in that file before adding a TransactionTestCase.
#
# Migrations still run on every session, so a stale schema cannot hide a
# failure -- and `makemigrations --check` guards model/migration drift.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --reuse-db"
filterwarnings = ["error::DeprecationWarning:apps.*"]
