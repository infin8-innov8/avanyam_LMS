# avanyam_aqua — VM3 (media): object storage.
#
# One compose file per host (architecture.md §7.4 / decision D8): `depends_on`
# does not cross hosts, so a single file spanning all three VMs would look
# correct and be meaningless.
#
# Only the S3 object store is containerised. clamd, ffmpeg and the Celery worker
# run as host services: clamd needs the signature database on the host filesystem,
# and the worker shares the application's venv.
#
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f s3
#
# Verify S3 end to end:  ../scripts/verify-s3.sh

name: avanyam-aqua

services:
  s3:
    # Pinned by digest, not tag (spec §14.2, architecture.md §17). The mutable
    # `4.48` tag can be repointed at different bits at any time, which is how a
    # Friday deploy ends up running code nobody reviewed. The tag is kept in the
    # comment purely so a human can tell what the digest corresponds to.
    #   chrislusf/seaweedfs:4.48 -> linux/amd64
    # To move to a new SeaweedFS release, resolve the new digest and update both:
    #   docker manifest inspect chrislusf/seaweedfs:<tag> --verbose \
    #     | python3 -c "import sys,json; [print(i['Descriptor']['digest']) for i in json.load(sys.stdin) if i['Descriptor']['platform']['architecture']=='amd64']"
    image: chrislusf/seaweedfs@sha256:aba492e2a4e4c90bff795745e8e660affa1f09e7650f5981bd7bccd1a06cd931
    container_name: avanyam-s3
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      # Bind every interface INSIDE the container. weed defaults to loopback, and
      # Docker publishes by DNAT to the container's external interface, so binding
      # 127.0.0.1 here makes the published port answer "connection reset by peer".
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.config=/data/conf/s3.json
      - -master.port=9333
      - -volume.port=8080
      - -filer.port=8888
      - -s3.port=8333
    ports:
      # Loopback only. VM1 reaches this over the private network in production;
      # nothing on the internet may reach the object store.
      - "127.0.0.1:8333:8333"
    volumes:
      - ./data/seaweedfs:/data
      # SSE-S3 KEK + filer signing key (K9). Read-only, and gitignored: this file
      # is generated by ../scripts/gen-seaweedfs-security.sh and must never be
      # committed. Passing these via compose `environment:` instead would put
      # secrets in a committed file, which the spec forbids (§14.2).
      - ./data/seaweedfs/conf/security.toml:/etc/seaweedfs/security.toml:ro
    env_file:
      # Supplies WEED_S3_SSE_KEK_PASSPHRASE so the KEK is stored wrapped on the
      # filer rather than in plaintext. Gitignored; absent file is tolerated.
      - path: ./data/seaweedfs/conf/sse.env
        required: false
    healthcheck:
      # An unauthenticated GET returns 403, which proves the S3 gateway is up AND
      # that authentication is switched on. A 200 here would mean the bucket store
      # is open, which is a fail, not a pass.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/ >/dev/null 2>&1 || [ $? -eq 1 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
