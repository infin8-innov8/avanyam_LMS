# avanyam_aqua — clamd 1.5.4 reference configuration.
#
# STATUS: reference copy, reconciled 2026-10-03 against the live
# /etc/clamav/clamd.conf. This file is NOT read by the daemon.
#
# The previous header claimed this file was "repo-authoritative". That was
# false and dangerous: clamd is started by systemd as
#   clamd --foreground --config-file=/etc/clamav/clamd.conf
# so every path below was ignored at runtime. The old repo-local paths
# (data/clamav/db, run/clamd.sock, logs/clamd.log) are not where the 108 MB
# signature database or the socket actually live, so following this file would
# have produced a daemon with an empty signature set. See tasks.md K1/K12.
#
# To change behaviour, edit /etc/clamav/clamd.conf, then re-reconcile it here:
#   sudo diff <(grep -vE '^\s*#|^\s*$' /etc/clamav/clamd.conf) <(grep -vE '^\s*#|^\s*$' <this file>)
#
# Scope: this is a CURATED reference, not an exhaustive dump. It carries every
# directive that matters operationally plus the tuning rationale. The packaged
# baseline in /etc/clamav/clamd.conf additionally sets ~30 inert defaults
# (Debug false, ReadTimeout 180, JsonStore*, PreludeEnable no, ...) which are
# omitted here. Verified 2026-10-03: every directive in this file that is not
# commented out is present in the live file with the same value.
#
# Deliberate deltas from the Debian default are marked [TUNED]; the rest is
# the packaged baseline. Invalid directive names fail silently at load, so this
# file is parsed by the binary rather than eyeballed.

# --- Effective baseline, mirrored from /etc/clamav/clamd.conf ----------------

# Signature database. freshclam writes here; clamd mmaps it at startup.
DatabaseDirectory /var/lib/clamav
CVDCertsDirectory /etc/clamav/certs

# Runs as the clamav user, not root: clamd parses hostile input.
User clamav

# Bind to loopback only. An unrestricted clamd is a TCP-exposed antivirus.
LocalSocket /var/run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 666
FixStaleSocket true
TCPAddr 127.0.0.1
TCPSocket 3310

LogFile /var/log/clamav/clamav.log
LogTime true
LogFileUnlock true
LogSyslog false
LogRotate true
LogFacility LOG_LOCAL6

# [TUNED] 8 vCPU host shared with 2 ffmpeg transcodes (memory policy M1/M9).
# 12 leaves headroom: an OOM here turns a video backlog into a scanning outage.
MaxThreads 12
MaxConnectionQueueLength 15
IdleTimeout 30
MaxQueue 100

# [TUNED] An LMS upload is never a 100MB+ scanned video. Cap it so a hostile or
# accidental huge file cannot pin the scanner.
MaxScanSize 100M
MaxFileSize 25M
StreamMaxLength 25M
MaxFiles 10000
MaxRecursion 16
MaxDirectoryRecursion 15
MaxScanTime 120000

# Format coverage.
ScanPE true
MaxEmbeddedPE 10M
ScanOLE2 true
ScanPDF true
ScanHTML true
MaxHTMLNormalize 10M
MaxHTMLNoTags 2M
MaxScriptNormalize 5M
ScanSWF true
ScanMail true
ScanArchive true
ArchiveBlockEncrypted false
ScanELF true
ScanXMLDOCS true
ScanHWP3 true
MaxRecHWP3 16
AlgorithmicDetection true
PhishingSignatures true
PhishingScanURLs true

# Do not scan the developer's own tooling or flag internal LMS tooling as PUA.
DetectPUA false
# Off by default: it is slow and produced no findings on this corpus.
StructuredDataDetection false
OLE2BlockMacros false
# NOTE: ClamAV 1.x removed the old AlertEncryptedArchive / AlertBrokenExecutables
# / AlertBrokenMedia directives that earlier revisions of this file carried. They
# were dead weight here and are not present in the live config.

# Never let one pathological scan take the whole host down.
ExitOnOOM false
LeaveTemporaryFiles false
ForceToDisk false
DisableCache false
PCREMatchLimit 10000
PCRERecMatchLimit 5000
PCREMaxFileSize 25M

# [TUNED] hourly self-check catches a corrupted signature database.
SelfCheck 3600
Bytecode true
BytecodeSecurity TrustSigned
BytecodeTimeout 60000

# No remote control surface: the app only ever needs PING/SCAN/STATS over TCP.
# Reload and shutdown are driven by systemd, not by the network.
EnableShutdownCommand false
EnableReloadCommand false
EnableStatsCommand false
EnableVersionCommand false
