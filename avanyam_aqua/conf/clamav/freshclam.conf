# avanyam_aqua — signature updates (task A5).
#
# STATUS: reference copy, reconciled 2026-10-03 against the live
# /etc/clamav/freshclam.conf. This file is NOT read by freshclam.
#
# Same defect as the old clamd.conf: every path below was repo-local and
# therefore wrong at runtime. Updates are driven by the systemd timer
#   clamav-freshclam-once.timer  (OnCalendar=daily, Persistent=true)
# which runs the packaged config, not this one.
#
# The old `DatabaseOwner rupesh` was the worst of it: freshclam must chown the
# signature files to the account clamd reads them as. The live value is `clamav`,
# because clamd runs as clamav (see clamd.conf `User clamav`).

# Signature database, shared with clamd's DatabaseDirectory. This is the single
# reason a freshclam failure becomes a scanning outage a few days later.
DatabaseDirectory /var/lib/clamav
CVDCertsDirectory /etc/clamav/certs

# clamd runs as clamav, so the signature files must be owned by clamav.
DatabaseOwner clamav

DatabaseMirror db.local.clamav.net
DatabaseMirror database.clamav.net

# Daily cadence is handled by the timer. Checks stays as a backstop if this is
# ever run as a long-lived service.
Checks 24
MaxAttempts 3

# NotifyClamd is intentionally NOT set. The packaged run uses
# clamav-freshclam-once.service, which exits after one pass; clamd picks up new
# signatures through its hourly `SelfCheck 3600`. Pointing this at a nonexistent
# socket was the second half of the original defect.

LogFile /var/log/clamav/freshclam.log
LogTime true
PidFile /var/run/clamav/freshclam.pid
Foreground false
