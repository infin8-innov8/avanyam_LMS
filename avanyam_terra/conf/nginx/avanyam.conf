# avanyam_terra — Nginx: TLS termination, security headers, HLS X-Accel-Redirect.
#
# Deployed as /etc/nginx/sites-available/avanyam + symlinked into sites-enabled.
#
# ## SPEC BASIS (avanyam_intro.txt)
# #
# #   L204-205  "Nginx  TLS termination, static, HLS range requests + caching,
# #                     X-Accel-Redirect (Django authorizes, Nginx serves)"
# #   L337-339  VM1 Nginx :443 -- TLS termination, security headers, static assets
# #   L1176     "TLS via internal CA"
# #   L1177     "HSTS, X-Content-Type-Options, Referrer-Policy, Permissions-Policy"
# #   L1181     "SECURE_PROXY_SSL_HEADER correctly set behind Nginx (classic
# #              silent misconfiguration that silently disables secure cookies)"
# #   L1046     HLS segments served so Nginx can cache and range-request them
# #
# ## CSP
# #
# # The strict nonce-based CSP is generated by django-csp in Django, NOT here.
# # Nginx deliberately does not add a CSP header of its own: two CSP headers
# # intersect rather than override, so a second one from Nginx would silently
# # weaken the Django policy. See avanyam_terra/memory.md for that trap.
#
# ## UPSTREAM
# #
# # gunicorn does not exist yet (no application code). This block is written so
# # that the day the app lands the only change needed is starting gunicorn. Until
# # then requests to / return 502, which is the honest state: a fake 200 from a
# # placeholder page would make the app look deployed when it is not.

# ---- connection limits -------------------------------------------------------
# worker_connections is a global directive and belongs in nginx.conf, not here.
# What belongs here is the per-key rate limit, which must be in http context --
# sites-enabled is included from http, so this file is a valid place for it.
limit_req_zone $binary_remote_addr zone=avanyam_req:10m rate=30r/s;

upstream avanyam_app {
    # [LOCAL] 127.0.0.1:8000 is the Gunicorn bind address (K8 units).
    # keepalive reuses upstream connections; without it every request pays a
    # fresh TCP+TLS-free handshake to gunicorn for no reason.
    # max_fails=0 means "never mark this upstream down". Without it nginx would
    # blacklist the single upstream after a few failures and then return 502 for
    # every request even after gunicorn recovers.
    server 127.0.0.1:8000 max_fails=0;
    keepalive 32;
}

# ---- HTTP :80 -> redirect to HTTPS -------------------------------------------
# Everything except ACME challenges is redirected. Serving anything over plain
# HTTP defeats the point of terminating TLS here.
server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name avanyam.local localhost;

    # Leave room for ACME http-01 if a real CA is used later.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS :443 --------------------------------------------------------------
server {
    # DEV: bound to loopback only. ufw is deny-incoming and nothing on this
    # laptop needs external reach. Production binds 0.0.0.0:443 and ufw opens
    # 443/tcp (see avanyam_aqua/scripts/apply-firewall.sh app).
    # HTTP/2 is enabled on the listen directive here, not with a standalone
    # `http2 on;` directive -- that form only exists from nginx 1.25.1 and this
    # is 1.24.0.
    listen 127.0.0.1:443 ssl http2;
    listen [::1]:443 ssl http2;
    server_name avanyam.local localhost;

    # [SPEC L1176] internal CA. For local development this is a self-signed leaf
    # from a local CA (see scripts/gen-dev-tls.sh), so the browser trust store
    # has to be told once -- which is correct, and much better than shipping
    # `ssl_verify off` or a cert nobody validates.
    ssl_certificate     /etc/nginx/tls/avanyam.crt;
    ssl_certificate_key /etc/nginx/tls/avanyam.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- security headers (SPEC L1177) ----
    # HSTS. max-age 31536000 with includeSubDomains and preload. Only meaningful
    # once the cert is trusted; on the dev CA it is still correct to send.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do not let the browser second-guess Content-Type. This is the cheap half
    # of the XSS story; the CSP from django-csp is the expensive, effective half.
    add_header X-Content-Type-Options "nosniff" always;

    # Do not leak full URLs (which can contain ids) to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Least privilege for the browser: no camera, no mic, no geolocation.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Belt and braces alongside django-csp. Not a substitute for it.
    add_header X-Frame-Options "DENY" always;

    # Do not advertise the nginx version.
    server_tokens off;

    # ---- logs ----
    access_log /var/log/nginx/avanyam.access.log;
    error_log  /var/log/nginx/avanyam.error.log warn;

    # ---- request limits ----
    limit_req zone=avanyam_req burst=50 nodelay;
    client_max_body_size 25m;   # direct uploads; HLS media goes via S3/X-Accel
    client_body_timeout 30s;

    # ---- static assets (SPEC L204) ----
    location /static/ {
        alias /var/www/avanyam/static/;
        expires 30d;
        access_log off;
        autoindex off;

        # nginx `add_header` does NOT merge: a location that declares any
        # add_header discards every add_header inherited from the server block.
        # So the security headers have to be repeated here, or /static/ ships
        # without nosniff and HSTS. Losing nosniff on served assets is a real
        # MIME-sniffing exposure, not a cosmetic gap.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;

        # Fingerprinted asset names make immutable truthful.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # ---- HLS: Django authorizes, Nginx serves the bytes ----
    #
    # Django issues X-Accel-Redirect: /protected-media/<opaque-token>, which
    # re-enters this server block. Because the internal location is only
    # reachable via X-Accel-Redirect, the S3 objects are never publicly
    # addressable and Django keeps the authorization decision.
    #
    # Range requests are REQUIRED for HLS: a player seeks with HTTP Range, and
    # without pass-through the whole segment is sent for every seek.
    location /protected-media/ {
        internal;
        alias /var/lib/avanyam/media/;

        default_type application/octet-stream;

        # Range + caching are the two things the spec calls out (L204).
        proxy_force_ranges on;
        open_file_cache max=1000 inactive=30s;
        open_file_cache_valid 15s;

        # HLS segments are small; do not buffer whole files to disk.
        sendfile on;
        tcp_nopush on;

        # Repeated for the same add_header non-inheritance reason as /static/.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        # Content-addressed names, so immutable is truthful.
        add_header Cache-Control "private, max-age=604800, immutable" always;
    }

    # ---- application ----
    location / {
        proxy_pass http://avanyam_app;
        proxy_http_version 1.1;

        # [SPEC L1181] THE setting the spec calls out as a classic silent
        # misconfiguration. Without it Django cannot tell the request arrived
        # over HTTPS, so request.is_secure() is False and SECURE cookies are
        # silently downgraded to insecure. No error is ever raised.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # WebSocket / SSE support for HTMX streaming responses later.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_buffering off;          # do not buffer SSE/streaming
    }

    # Health endpoint for the load balancer. Never logged, never authenticated.
    location = /nginx-health {
        access_log off;
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";

        # add_header is declared here (not needed for correctness of the body,
        # but this endpoint answers unauthenticated probes, so it still gets the
        # full header set rather than being the one hole in the policy).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
    }
}

# WebSocket upgrade mapping. Declared at http level in nginx.conf include; if the
# include is missing this map degrades to close, which only affects streaming.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
