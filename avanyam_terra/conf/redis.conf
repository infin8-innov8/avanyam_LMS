# avanyam_terra — Redis configuration.
#
# Deployed as /etc/redis/redis.conf, owned by the packaged `redis` system user.
#
# ## PATH CHANGE (documented deviation from the earlier repo copy)
# #
# # This file previously pointed dir/logfile/pidfile at paths inside the repo:
# #     dir      /home/rupesh/avanyam_lms/avanyam_terra/data/redis
# #     logfile  /home/rupesh/avanyam_lms/avanyam_terra/logs/redis.log
# #     pidfile  /home/rupesh/avanyam_lms/avanyam_terra/run/redis.pid
# #
# # Those paths cannot be used by a system-level Redis. /home/rupesh is mode
# # 0750, so the `redis` user cannot traverse into the repo without either
# # loosening /home/rupesh or adding `redis` to the rupesh group. Neither is
# # acceptable for a cache/broker, so the state lives in the standard system
# # locations instead.
# #
# # Redis was previously running from a binary that no longer existed on the
# # filesystem, inside the agent session's own cgroup. It is now the apt package
# # redis-server 7.0.15 managed by systemd, which is the only arrangement that
# # survives logout and reboot.
#
# ## Bind address
# #
# # Loopback only. This is what makes the default-deny ufw posture sufficient
# # with no per-service exception (see avanyam_aqua/scripts/apply-firewall.sh).
bind 127.0.0.1
port 6379

protected-mode yes
daemonize no
supervised systemd

pidfile /run/redis/redis-server.pid
logfile /var/log/redis/redis-server.log
dir /var/lib/redis

# [SPEC] Redis is the Celery broker. AOF with everysec bounds task loss to ~1s.
# RDB snapshots are kept as a second safety net.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
save 900 1
save 300 10
rdbcompression yes
rdbchecksum yes

# [LOCAL] 512 MB ceiling. Celery task payloads here are metadata plus short
# job descriptors, not media. noeviction is mandatory, not a default: with
# allkeys-lru Redis would silently evict queued tasks and the broker would
# lose work under pressure. Exceeding 512 MB should page a human instead.
maxmemory 512mb
maxmemory-policy noeviction

# [SPEC] avanyam_intro.txt requires Redis not be world-readable. Loopback bind
# plus a mandatory password is defence in depth: the password also stops a
# compromised local process that found the port.
requirepass activ8*o(red)

# Disable the commands that can destroy or exfiltrate state. CONFIG in
# particular would let a local attacker read requirepass straight out of the
# running config.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

timeout 0
tcp-keepalive 300
databases 16

slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100
