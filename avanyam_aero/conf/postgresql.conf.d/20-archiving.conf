# ############################################################################
# avanyam_aero — PostgreSQL 16 continuous WAL archiving (WAL-G)
#
# Deployed as /etc/postgresql/16/main/conf.d/20-archiving.conf
# ############################################################################
#
# ## WHY THIS FILE EXISTS SEPARATELY
# #
# # 10-avanyam.conf is memory/IO sizing and is byte-identical in intent between
# # the laptop and VM2. Archiving is different: the *settings* are portable but
# # the *destination* is not. The laptop archives to the local SeaweedFS
# # gateway; VM2 must archive to a genuinely offsite bucket. Keeping this in its
# # own drop-in means changing the destination never means editing the sizing
# # file that was reviewed line by line.
# #
# # It loads after 10-avanyam.conf and before 99-dev-override.conf
# # (PostgreSQL reads conf.d in lexical order, last match wins).
#
# ## PROVENANCE
# #
# #   [SPEC]    avanyam_intro.txt
# #   [PG16-DEF] PostgreSQL 16 stock default, restated so it is auditable
# #   [DERIVED] computed, arithmetic shown
# #   [LOCAL]   engineering judgement, needs sign-off before VM2 deploy
#
# ## PREVIOUS STATE ON THIS LAPTOP — THE GAP THIS CLOSES
# #
# #   archive_mode    = off
# #   archive_command = (unset)
# #
# # i.e. NO point-in-time recovery capability whatsoever. WAL-G was not even
# # installed. Any corruption or accidental DROP was unrecoverable except from
# # the nightly pg_dump, which cannot reach a point in time.
# ############################################################################

# [SPEC] avanyam_intro.txt L252: "WAL-G   encrypted PITR backups, offsite"
# [SPEC] avanyam_intro.txt L1219: "Postgres: WAL-G continuous archiving +
#       encrypted offsite snapshots + PITR."
#
# archive_mode must be `on` (not `always`) — `always` also archives on a
# standby, which is correct for a replica but produces a duplicate stream from
# a primary that already archives.
archive_mode = on

# [LOCAL] The wrapper exists so that:
#   1. archive_command runs as the `postgres` user with an empty environment,
#      so the S3 credentials must be injected from a file (/etc/walg/env,
#      mode 640 root:postgres) rather than inherited;
#   2. credentials never appear in postgresql.conf, because archive_command is
#      world-readable via `SHOW archive_command;`;
#   3. a failure exits non-zero, which is what makes PostgreSQL retry the
#      segment and set archive_failed. WAL-G already does this; the wrapper
#      uses `exec` so it does not mask the exit status.
#
# %p = path of the WAL segment to archive. No other placeholder is valid here.
archive_command = '/usr/local/bin/walg-postgres.sh wal-push %p'

# NOTE: there is deliberately NO `backup_command` setting here.
# `backup_command` is a Percona XtraBackup setting, not a PostgreSQL GUC. Setting
# it makes the cluster refuse to start:
#     LOG:  unrecognized configuration parameter "backup_command"
#     FATAL:  configuration file "...20-archiving.conf" contains errors
# WAL-G base backups are driven from outside the server instead:
#     pg_basebackup -D <dir> -Ft -z -X stream --checkpoint=fast
#     /usr/local/bin/walg-postgres.sh backup-push <dir>
# run from cron/systemd. See avanyam_aero/DR.md §BACKUP.

# [DERIVED] avanyam_intro.txt L1219 requires continuous archiving. With
# archive_timeout at the [PG16-DEF] default of 0, a quiet database archives
# nothing, so the recoverable window silently grows without bound and RPO
# becomes "since the last checkpoint" rather than a stated number.
#
# 300s bounds worst-case data loss to 5 minutes of WAL. WAL volume cost:
# a ~32 MB segment every 5 min = ~9.2 GB/day of WAL pushed to S3 even when
# idle. That is why this is [DERIVED] and flagged for sign-off: on VM2 the
# budget should be checked against the retention window in
# avanyam_intro.txt's storage plan before this goes live.
archive_timeout = 300s

# [PG16-DEF] restated for auditability.
wal_compression = off

# [LOCAL] min_wal_size controls how aggressively PostgreSQL recycles WAL
# segments in pg_wal. With archiving on, a segment must survive in pg_wal until
# archive_command confirms it is stored, so 80 MB (the default) is too tight
# during a burst; 512 MB gives archiving room to retry.
min_wal_size = 512MB

# ############################################################################
# ## LOCAL-LEDGER — [LOCAL] values needing sign-off before VM2 deploy
# ############################################################################
# archive_timeout = 300s   Worst-case RPO 5 min, but drives WAL volume. Validate
#                          against retention budget on VM2.
# min_wal_size = 512MB     Gives archive_command room to retry without stalling
#                          writes. Costs 512 MB of pg_wal at all times.
# ############################################################################

# ############################################################################
# ## RESTORE — NOT SET HERE, DELIBERATELY
# ############################################################################
# restore_command is intentionally absent from this file.
#
# Leaving it permanently set is a trap: on a normal start PostgreSQL will
# attempt recovery from the archive, and if the archive is empty or stale the
# server comes up believing it restored to some earlier point in time. Recovery
# must be opted into per-restore.
#
# To restore (see avanyam_aero/DR.md §PITR):
#   1. systemctl stop postgresql
#   2. restore_command = '/usr/local/bin/walg-postgres.sh wal-fetch %f %p'
#   3. recovery_target_time = '<timestamp>'   (or recovery_target_lsn)
#   4. recovery_target_action = 'promote'
#   5. touch $PGDATA/recovery.signal
#   6. systemctl start postgresql
# ############################################################################
