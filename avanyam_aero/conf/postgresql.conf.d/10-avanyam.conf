# ############################################################################
# avanyam_aero — PostgreSQL 16 configuration for the VM2 TARGET
#                4 vCPU / 16 GB RAM / 300 GB SSD
# ############################################################################
#
# ## PROVENANCE OF EVERY VALUE BELOW
# #
# #   [SPEC]        quoted directly from avanyam_intro.txt (line ref given)
# #   [PG16-DEF]    the PostgreSQL 16 stock default, restated here explicitly
# #                 so the effective value is auditable rather than implicit
# #   [DERIVED]     computed from a [SPEC] ratio — arithmetic shown
# #   [LOCAL]       NOT specified by the client spec. A deliberate engineering
# #                 judgement. Every one of these needs sign-off before the
# #                 VM2 deploy. Listed together in §LOCAL-LEDGER at the bottom.
# #
# # There are no other categories. If a setting is not tagged, that is a bug.
#
# ## SIZING AUTHORITY — avanyam_intro.txt §14.1, verbatim
# #
# #   VM2 DATA          4 vCPU, 16 GB RAM, 300 GB SSD
# #                      The 16 GB is deliberate: Postgres keeps hot data in
# #                      shared_buffers (default 4 GB here) + OS page cache, and
# #                      the streaming standby holds its own connection set.
# #                      Most RAM-hungry VM, and the first to suffer if
# #                      under-sized.
#
# #   -> shared_buffers = 4GB      [SPEC, quoted]
# #   -> effective_cache_size = 12GB   [DERIVED] the spec says shared_buffers
# #      PLUS OS page cache on a 16 GB box, and aero/architecture.md §5 fixes
# #      that at 4 GB + ~8 GB page cache. 4:12 = 1:3 of total RAM.
# #      Note this is 25% / 75%, which is also PostgreSQL's own default
# #      heuristic — the spec and the database agree, which is reassuring but
# #      is a coincidence of the 16 GB figure, not the source of it.
#
# ############################################################################
# #  DO NOT DEPLOY THIS FILE UNCHANGED TO THE DEVELOPMENT HOST.               #
# #  It is sized for a 16 GB VM. The dev host measures 7.50 GiB MemTotal and   #
# #  already commits ~62% of that to the desktop, IDE and other services.     #
# #  Deploy it TOGETHER WITH 99-dev-override.conf, which is read last and      #
# #  overrides every RAM-critical value. See DEPENDENCIES.md §2.4.            #
# ############################################################################
#
# Deployment status: see §DEPLOYMENT-STATUS at the bottom of this file.

# ── Connections ─────────────────────────────────────────────────────────────

# [PG16-DEF] Debian/Ubuntu default is 'localhost'. 127.0.0.1 is equivalent for
# a single-stack host and is unambiguous, so it is restated rather than inherited.
listen_addresses = '127.0.0.1'
port = 5432

# [PG16-DEF] 100 is the PostgreSQL 16 default and is what Debian ships.
#
# NOT spec-derived, and it is CONSTRAINED by aero/architecture.md §4.1:
#   pool sizing = (Gunicorn workers + Celery workers) x safety factor,
#   kept WELL UNDER max_connections / 2, so the superuser reserve AND the
#   streaming standby's own connection set still fit.
#
# Worked example for the VM2 target [DERIVED from architecture.md §4.1 + §14.1]:
#   VM1 = 4 vCPU x 2 Gunicorn workers/vCPU  = 8 Gunicorn workers
#   Celery fast workers                     = 2   (VM3 bulk is capped at 2)
#   x2 safety factor                       = 20
#   + streaming standby connection set      = ~10
#   + Keycloak (its OWN pool, never through PgBouncer transaction mode) = separate
#   20 + 10 = 30, and 30 < 100/2 = 50.  -> 100 holds with headroom.
#
# ACTION REQUIRED: this is only valid while the pool stays under 50. Finalise
# max_connections and the PgBouncer pool sizes TOGETHER, never one without the
# other. Until P0.2 fixes the real worker counts, treat 100 as provisional.
max_connections = 100
superuser_reserved_connections = 3

# ── Memory ──────────────────────────────────────────────────────────────────

# [SPEC] avanyam_intro.txt §14.1: "shared_buffers (default 4 GB here)"
# 25% of 16 GB. The single most RAM-hungry setting on the box.
shared_buffers = 4GB

# [DERIVED] 4 GB shared_buffers + ~8 GB OS page cache = 12 GB.
# aero/architecture.md §5 states this split as "~12 GB".
# This is a PLANNER HINT, not an allocation. Postgres never reserves it.
effective_cache_size = 12GB

# [PG16-DEF] 4MB. IMPORTANT: work_mem is PER SORT/HASH NODE PER CONNECTION, not
# per connection. At 100 connections with several nodes each, a large GLOBAL
# value reaches into GB and starves everything else. Keep the global modest and
# grant reporting queries more per-role instead:
#     ALTER ROLE avanyam_reporting SET work_mem = '64MB';
# so a runaway report cannot starve the LMS. See aero/architecture.md §10.
work_mem = 4MB

# [PG16-DEF] 64MB. An earlier draft here said 512MB, which was invented and is
# removed — it is 8x the default for no spec-stated reason.
maintenance_work_mem = 64MB

# [PG16-DEF] 8MB.
temp_buffers = 8MB

# ── Planner ─────────────────────────────────────────────────────────────────

# [LOCAL] 1.1 is the conventional SSD figure; PostgreSQL's default is 4.0, which
# assumes spinning rust. The spec states SSD but sets no value. Confirm against
# the real VM2 before rollout.
random_page_cost = 1.1

# [LOCAL] 200 is the conventional SSD figure; PostgreSQL 16's default is 1.
# The spec states SSD but sets no value. (PostgreSQL 18 raised its own default
# for this reason, so this will eventually be upstream behaviour.)
effective_io_concurrency = 200

# ── WAL & durability ────────────────────────────────────────────────────────

# [PG16-DEF] replica. Also REQUIRED by the spec: §14.1 lists "streaming standby"
# and §1219 "WAL-G continuous archiving + encrypted offsite snapshots", neither
# of which works below replica.
wal_level = replica

# [PG16-DEF] 10. Required by the streaming standby + WAL-G.
max_wal_senders = 10

# [LOCAL] 4GB. PostgreSQL's and Debian's default is 1GB. The spec calls the
# audit log and per-attempt paper snapshots append-only and never-shrinking on a
# 300 GB disk, which argues for fewer, larger checkpoints — but it sets no
# number. Confirm against real write volume.
max_wal_size = 4GB

# [LOCAL] 1GB. PostgreSQL's and Debian's default is 80MB.
min_wal_size = 1GB

# [PG16-DEF] 0.9.
checkpoint_completion_target = 0.9

# [PG16-DEF] on. Never trade durability for latency in this system: §1219 pairs
# WAL-G with encrypted offsite snapshots, i.e. the design assumes we may need to
# recover to a point in time.
synchronous_commit = on

# ── Autovacuum ──────────────────────────────────────────────────────────────

# [PG16-DEF] on.
autovacuum = on

# [LOCAL] 4 vs the default 3. §14.1 stresses the append-only audit log, which is
# the table most in need of steady vacuuming, and a 300 GB disk gives autovacuum
# more to walk. Not spec-stated. Confirm under real load.
autovacuum_max_workers = 4

# [LOCAL] 30s vs the default 60s. Same audit-log rationale. Not spec-stated.
autovacuum_naptime = 30s

# [LOCAL] 0.05 vs the default 0.2 — vacuum a table after 5% churn instead of
# 20%, bounding bloat on the hot append-only tables. Not spec-stated.
autovacuum_vacuum_scale_factor = 0.05

# [LOCAL] 0.02 vs the default 0.1. Not spec-stated.
autovacuum_analyze_scale_factor = 0.02

# ── Query guardrails ────────────────────────────────────────────────────────
# aero/architecture.md §10: reporting must not be able to hold locks against the
# LMS. These bounds are the mechanism. None are spec-stated.

# [LOCAL] 30s. PostgreSQL's default is 0 (unlimited).
statement_timeout = 30s

# [LOCAL] 60s. PostgreSQL's default is 0 (unlimited).
idle_in_transaction_session_timeout = 60s

# [LOCAL] 10s. PostgreSQL's default is 0 (unlimited).
lock_timeout = 10s

# [PG16-DEF] 1s.
deadlock_timeout = 1s

# ── Logging ─────────────────────────────────────────────────────────────────

# [PG16-DEF] on.
logging_collector = on

# [PG16-DEF] 'log'.
log_directory = 'log'

# [PG16-DEF]
log_filename = 'postgresql-%Y-%m-%d.log'

# [PG16-DEF] 1d.
log_rotation_age = 1d

# [LOCAL] 100MB vs the default 10MB. On a 300 GB disk with a chatty audit log,
# 10MB rotations are frequent. Not spec-stated.
log_rotation_size = 100MB

# [PG16-DEF] on.
log_truncate_on_rotation = on

# [LOCAL] 500ms vs the default -1 (log everything). A threshold, so ordinary
# queries are not logged. Not spec-stated.
log_min_duration_statement = 500

# [PG16-DEF] on.
log_checkpoints = on

# [PG16-DEF] on.
log_lock_waits = on

# [LOCAL] 8MB vs the default -1 (log all temp files). Not spec-stated.
log_temp_files = 8MB

# [PG16-DEF] off — high volume, low signal.
log_connections = off
log_disconnections = off

# [PG16-DEF] matches Debian's stock value.
log_line_prefix = '%m [%p] %q%u@%d '

# [LOCAL] 'UTC'. Debian ships 'Asia/Kolkata' on this host. UTC is chosen so logs
# from all three VMs are directly comparable and so a future UTC deployment does
# not silently shift timestamps. Not spec-stated — flagged for sign-off.
log_timezone = 'UTC'

# ── Locale / text search ────────────────────────────────────────────────────

# [PG16-DEF] matches Debian's stock value.
datestyle = 'iso, mdy'

# [LOCAL] 'UTC'. Same rationale and same caveat as log_timezone above: Debian
# ships 'Asia/Kolkata' here. Not spec-stated — flagged for sign-off.
timezone = 'UTC'

# [PG16-DEF] matches Debian's stock value.
default_text_search_config = 'pg_catalog.english'

# [PG16-DEF] 'C'. Debian ships 'en_US.UTF-8'; 'C' keeps server error text
# predictable regardless of host locale.
lc_messages = 'C'

# ############################################################################
# §LOCAL-LEDGER — every value above that the client spec does NOT state
# ############################################################################
#
# These 14 are engineering judgements, not spec. Grouped by how much they matter:
#
#   Affect VM2 RAM materially — check first:
#     shared_buffers 4GB / effective_cache_size 12GB   <- actually [SPEC]/[DERIVED]
#     (the RAM-critical pair IS spec-derived; see §Memory above)
#
#   Affect durability or recoverability — check carefully:
#     max_wal_size 4GB, min_wal_size 1GB        checkpoint frequency / write volume
#     statement_timeout 30s                     query guardrail
#     random_page_cost 1.1                      planner accuracy on SSD
#     effective_io_concurrency 200              planner accuracy on SSD
#
#   Affect maintenance behaviour only — low risk:
#     autovacuum_max_workers 4, autovacuum_naptime 30s,
#     autovacuum_vacuum_scale_factor 0.05, autovacuum_analyze_scale_factor 0.02
#
#   Affect log volume/format only — low risk:
#     log_rotation_size 100MB, log_min_duration_statement 500,
#     log_temp_files 8MB, log_timezone UTC, timezone UTC
#
# ############################################################################
# §DEPLOYMENT-STATUS
# ############################################################################
#
# On the development host this file is deployed ALONGSIDE 99-dev-override.conf,
# which is read last (PostgreSQL sorts conf.d filenames) and overrides
# shared_buffers, effective_cache_size and statement_timeout.
#
# Both files are deployed deliberately: it means the VM2 target file is parsed
# and loaded on every dev start, so a syntax error in it surfaces here rather
# than during the real VM2 deploy. 99-dev-override.conf explicitly resets every
# setting whose VM2 value would be unsafe on a 7.50 GiB host, so nothing leaks
# through from this file. Verify that with:
#
#     SELECT name, setting, sourcefile FROM pg_settings
#      WHERE sourcefile LIKE '%conf.d%';
#
# Included from PGDATA/postgresql.conf via `include_dir = 'conf.d'` (line 818 of
# the stock Debian postgresql.conf — the LAST directive, so drop-ins win).
# ############################################################################
