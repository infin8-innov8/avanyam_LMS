# ############################################################################
# avanyam_aero — DEVELOPMENT HOST OVERRIDE
#
# Read LAST (PostgreSQL sorts conf.d filenames), so every value here beats
# 10-avanyam.conf. Deployed TOGETHER with it, on purpose: 10-avanyam.conf is
# the VM2 target and gets parsed on every dev start, so a syntax error in the
# production file surfaces here instead of during the real VM2 deploy.
#
# This file must reset EVERY setting whose VM2 value is unsafe on this host.
# Today that is exactly three: shared_buffers, effective_cache_size,
# statement_timeout. Verify nothing leaks through with:
#     SELECT name, setting, sourcefile FROM pg_settings
#      WHERE sourcefile LIKE '%conf.d%';
# ############################################################################
#
# ## WHAT THIS HOST ACTUALLY IS
# #
# Measured 2026-10-03 on the dev host. Not estimated — read from the kernel and
# from ps RSS.
#
#   /proc/meminfo MemTotal     7.50 GiB  = 7680 MB
#   /proc/meminfo MemAvailable 3.53 GiB  = 3615 MB
#   /proc/meminfo SwapTotal    4.00 GiB, of which 1.5 GiB already in use
#   cgroup memory limit        none — this is bare metal, not a container
#
# So the "9 GiB" dev/test figure does not match this machine: MemTotal is
# 7.50 GiB, consistent with an 8 GiB laptop minus OS and firmware reserve.
# Everything below is sized for 7.50 GiB, the only figure that can be measured.
# On a genuine 9 GiB host these values simply have MORE headroom, never less —
# so they are safe to carry over unchanged. Re-measure if the host changes.
#
# ## MEASURED NON-Postgres FOOTPRINT
# #
#   VS Code (code)                       2396 MB
#   opencode agent                         752 MB
#   GNOME / X11 / gsd-* / evolution      ~1150 MB
#   ---------------------------------------------
#   desktop + IDE + agent subtotal        4298 MB
#
#   SeaweedFS (weed)                       194 MB
#   clamd                                   104 MB
#   dockerd + containerd                   109 MB
#   freshclam                               19 MB
#   redis-server                             6 MB
#   ---------------------------------------------
#   other project services subtotal         432 MB
#
#   TOTAL already committed               4730 MB  =  62% of MemTotal
#
# All three spec'd VMs are simulated on this one host simultaneously, plus the
# desktop. aero/architecture.md §4.1 exists precisely because a shared host
# starves everything else — this file is that lesson applied to memory.
#
# ############################################################################
# ## DERIVATION — no value below is guessed
# ############################################################################
#
# The spec gives ONE anchor (avanyam_intro.txt §14.1, on a 16 GB VM2):
#
#     shared_buffers (default 4 GB here) + OS page cache
#
# giving a 1:3 split of RAM, restated in aero/architecture.md §5 as
# 4 GB shared_buffers + ~12 GB effective cache. That ratio is the portable part.
#
# Candidate 1 — the spec's rule applied literally to THIS host:
#     25% x 7680 MB MemTotal = 1920 MB shared_buffers
#     REJECTED. 1920 + 4730 (measured above) = 6650 MB of 7680 MB = 87% of the
#     machine committed before the kernel, page cache, or any ffmpeg / ClamAV
#     spike. The spec's 25% assumes Postgres owns a dedicated 16 GB VM; here it
#     shares with a 4.3 GB desktop. Applying it literally is how you get swap
#     thrash during test runs.
#
# Candidate 2 — the spec's SAME 25% ratio applied to what Postgres can actually
# obtain, which is the kernel's own measurement rather than my estimate:
#     25% x 3615 MB MemAvailable = 904 MB shared_buffers
#     ACCEPTED. MemAvailable is computed by the kernel after excluding
#     reclaimable cache, so it answers "what is genuinely obtainable now"
#     without me guessing.
#
# Rounded DOWN to a clean 768 MB (3 x 256) for headroom, because MemAvailable
# swings by hundreds of MB with IDE and agent usage.
#
# effective_cache_size preserves the spec's 1:3 ratio exactly:
#     3 x 768 MB = 2304 MB
#
# Result: 768 MB shared_buffers + 432 MB other project services = 1200 MB worst
# case for every project service on the box, leaving ~2180 MB for the kernel and
# page cache on top of the 4.3 GB desktop. That is the "real headroom" goal.
#
# ############################################################################

# [DERIVED] 25% of MemAvailable (904 MB), rounded down to 768 MB.
# Overrides the VM2 target's 4GB. A PLANNER HINT / lazily-faulted pool, not a
# reservation — which is why the earlier 4GB never crashed the box.
shared_buffers = 768MB

# [DERIVED] 3 x shared_buffers, preserving the spec's 1:3 split. Overrides 12GB.
effective_cache_size = 2304MB

# [LOCAL-DEV] Unlimited. The VM2 target sets 30s as a guardrail so a runaway
# report cannot hold locks against the LMS (aero/architecture.md §10). On dev
# that guardrail is actively harmful: a long initial migration, a factory_boy
# fixture load, or a deliberate REINDEX would be killed at 30s and produce a
# confusing failure. This is a dev-only relaxation and MUST NOT be copied to
# VM1/VM2/VM3.
statement_timeout = 0

# ############################################################################
# ## DELIBERATELY NOT OVERRIDDEN
# ############################################################################
#
# max_connections = 100
#     Left at the VM2 value on purpose. Connection-count bugs must reproduce in
#     dev or they will not reproduce in staging, and PgBouncer pool sizing
#     (architecture.md §4.1) is validated against max_connections, not against
#     whatever dev happens to use. Dev/prod connection semantics stay identical.
#
# work_mem = 4MB, maintenance_work_mem = 64MB, temp_buffers = 8MB
#     Already the PostgreSQL 16 defaults and small in absolute terms. Inherited
#     unchanged.
#
# max_wal_size = 4GB, min_wal_size = 1GB
#     These cost DISK, not RAM, and the VM2 target has 300 GB. Inherited.
#
# autovacuum_max_workers = 4, autovacuum_naptime = 30s, *_scale_factor 0.05/0.02
#     Worst case 4 workers x 64MB maintenance_work_mem = 256 MB, and only during
#     a vacuum. Inherited so maintenance behaviour matches production.
#
# random_page_cost, effective_io_concurrency, logging, timezone
#     Not RAM-critical. Inherited so the planner and the logs behave the same in
#     dev as in production. Note timezone = 'UTC' therefore also applies here,
#     overriding this host's Debian default of 'Asia/Kolkata' — intentional, see
#     §LOCAL-LEDGER in 10-avanyam.conf.
# ############################################################################
