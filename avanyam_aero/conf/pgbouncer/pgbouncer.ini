; avanyam_aero — PgBouncer 1.22 configuration.
;
; STATUS: authored 2026-10-03 for the development laptop. Deployed to
; /etc/pgbouncer/pgbouncer.ini.
;
; The packaged file this replaces defined NO databases at all (every entry was
; commented out) and shipped an empty userlist, so pgbouncer listened on 6432
; and rejected every connection with "no such database". See tasks.md K4.
;
; Design constraint from the specification (avanyam_intro.txt 14.1):
;   "PgBouncer's transaction pool is safe for Django but NOT for Keycloak
;    (it breaks prepared-statement/session state, presenting as sporadic login
;    failures that are very hard to diagnose). Keycloak therefore gets its OWN
;    connection pool, outside the PgBouncer transaction pool."
;
; That is why there are exactly two pools below with different pool_mode values,
; and why there is deliberately NO wildcard `* = host=...` entry: a wildcard
; would silently re-expose every database in the cluster (avanyam_audit,
; avanyam_reporting, ...) through the pooler and defeat the least-privilege
; split that bootstrap.sql enforces. Isolation is enforced in PostgreSQL itself;
; this file just refuses to route around it.

[databases]

; Django. Transaction pooling is what makes PgBouncer worth having: it collapses
; many short-lived client connections onto a small fixed set of server
; connections, which is the fix for the "#1 scaling wall" (exhaustion of
; PostgreSQL backends under many Gunicorn workers + Celery processes).
avanyam = host=127.0.0.1 port=5432 dbname=avanyam pool_mode=transaction

; Keycloak. Its own pool in SESSION mode, so a client keeps one server
; connection for its whole session and all session/prepared-statement state
; stays coherent. Never point Keycloak at the transaction pool above.
keycloak = host=127.0.0.1 port=5432 dbname=keycloak pool_mode=session

; Deliberately absent: avanyam_audit and avanyam_reporting. The audit and
; reporting roles connect directly to PostgreSQL. Routing them through the
; pooler would blur the tamper-evidence boundary for no performance gain.
;
; MIGRATIONS BYPASS THE POOLER. avanyam_migrate is intentionally NOT a pooled
; user: `manage.py migrate` must connect straight to PostgreSQL on 5432.
; Transaction pooling is unsafe for non-transactional DDL -- notably
; CREATE INDEX CONCURRENTLY and ALTER TYPE ... ADD VALUE -- because PgBouncer
; may hand the next statement to a different server connection, and those
; statements cannot run inside a transaction block at all. This matches
; avanyam_intro.txt 14.2: "Migrations run as a ONE-SHOT container with the
; migrate DB role, BEFORE the app rolls."

[pgbouncer]

; Loopback only. PgBouncer speaks the PostgreSQL wire protocol with no
; authentication of its own beyond the userlist, so it must never be exposed.
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql

logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

; SCRAM-SHA-256 end to end: client -> PgBouncer and PgBouncer -> PostgreSQL both
; verify SCRAM, and userlist.txt holds SCRAM verifiers rather than plaintext.
; auth_type = md5 (the packaged default) would have silently downgraded every
; connection to MD5.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Admin console access (SHOW POOLS, SHOW STATS, RELOAD, PAUSE) on the virtual
; `pgbouncer` database. This is a pooler control channel only and grants no
; PostgreSQL access.
; TODO(prod): replace with a dedicated login role that holds no database grants.
; The postgres superuser is used here because the development laptop has no
; separate pooler-admin role yet.
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

; Prepared-statement support. Without this, transaction pooling breaks Django:
; psycopg issues a PREPARE on one server connection which is then handed to a
; different client, and the failure surfaces as a sporadic
; "prepared statement ... does not exist" rather than anything pool-related.
; This is the setting that makes transaction mode safe for Django specifically.
max_prepared_statements = 100

ignore_startup_parameters = extra_float_digits

; Sizing for the development laptop (7.50 GiB RAM, shared with a desktop and an
; IDE). PostgreSQL max_connections is 100 on this host; the production sizing
; in memory.md is deliberately NOT applied here and must be recomputed once real
; Gunicorn/Celery worker counts exist.
max_client_conn = 100
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40
max_user_connections = 30

server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
query_wait_timeout = 30
client_login_timeout = 60

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
